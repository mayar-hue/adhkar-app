<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أذكار الصباح</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f7f5f0;
      color: #333;
      text-align: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #777;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    #playButton {
      background: #333;
      color: white;
    }

    #downloadButton {
      background: #eee;
      color: #333;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>أذكار الصباح 🤍</h1>

    <p>ابدئي يومك بذكر الله</p>

    <button id="playButton">▶ تشغيل الأذكار</button>

    <button id="downloadButton">↓ تحميل للاستخدام بدون إنترنت</button>

    <div id="status"></div>
  </div>

  <script>
    const audio = new Audio("adhkar.mp3");

    document.getElementById("playButton").onclick = function () {
      audio.play();
    };

    document.getElementById("downloadButton").onclick = async function () {
      const response = await fetch("adhkar.mp3");
      const blob = await response.blob();

      const url = URL.createObjectURL(blob);
      audio.src = url;

      document.getElementById("status").innerText =
        "تم تحميل الأذكار 🤍 يمكنك تشغيلها بدون إنترنت.";
    };
  </script>

</body>
</html>
